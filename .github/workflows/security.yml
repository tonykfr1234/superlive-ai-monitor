name: Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan repository for secrets and private runtime files
        run: python scripts/security_scan.py .
      - name: Compile Python source
        run: python -m py_compile src/*.py scripts/*.py

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install numpy pillow opencv-python imageio-ffmpeg requests psutil
      - name: Run geometry, activity, protocol, UI and synthetic video tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Verify installation and settings preservation in an isolated fixture
        shell: pwsh
        run: ./tests/test_deployment.ps1
