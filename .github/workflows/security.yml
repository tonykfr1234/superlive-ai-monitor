name: Security Scan

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan repository for secrets and private runtime files
        run: python scripts/security_scan.py .
      - name: Compile Python source
        run: python -m py_compile src/*.py scripts/*.py
